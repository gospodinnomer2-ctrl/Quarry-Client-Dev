
name: Build Quarry

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found!"
            ls -la
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE"
          ls -la

      - name: Inspect Quarry sources
        run: |
          echo "===== PROJECT FILES ====="
          find Quarry -type f -maxdepth 8 | sort
          for f in Quarry/build.gradle Quarry/settings.gradle Quarry/gradle.properties Quarry/src/main/resources/fabric.mod.json Quarry/src/main/resources/quarry.mixins.json $(find Quarry/src/main/java -type f -name '*.java' | sort); do
            if [ -f "$f" ]; then
              echo ""
              echo "===== $f ====="
              cat "$f"
            fi
          done

      - name: Build mod
        run: gradle -p Quarry build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Quarry-1.21.4
          path: Quarry/build/libs/*.jar
          if-no-files-found: error
